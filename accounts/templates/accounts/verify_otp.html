{% extends "accounts/auth_base.html" %}
{% block title %}Verify Email | LibraPro{% endblock %}
{% block content %}
<h3 class="auth-title text-center">Verify your email</h3><p class="text-secondary text-center mb-4">Enter the 6-digit code sent to your email. It expires in 5 minutes.</p>
<form method="post">{% csrf_token %}<label class="form-label fw-semibold">Verification code</label><input class="form-control mb-4" name="otp" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" required><button class="btn btn-primary w-100">Verify &amp; continue</button></form>
<form method="post" action="{% url 'accounts:resend_otp' %}" class="mt-3">{% csrf_token %}<button class="btn btn-outline-secondary w-100">Resend OTP</button></form>
{% endblock %}
