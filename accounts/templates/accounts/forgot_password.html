{% extends "accounts/auth_base.html" %}
{% block title %}Forgot Password | LibraPro{% endblock %}
{% block content %}
<h3 class="auth-title text-center">Forgot password?</h3><p class="text-secondary text-center mb-4">Enter your registered email to request a reset code.</p>
<form method="post">{% csrf_token %}<label class="form-label fw-semibold">Email address</label><input class="form-control mb-4" type="email" name="email" placeholder="you@example.com" autocomplete="email" required><button class="btn btn-primary w-100">Send reset OTP</button></form>
<div class="text-center mt-4"><a class="auth-link" href="{% url 'accounts:login' %}">Back to login</a></div>
{% endblock %}
