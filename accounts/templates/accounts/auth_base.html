<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LibraPro{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{min-height:100vh;background:linear-gradient(135deg,#eef4ff,#f7f0ff);font-family:Segoe UI,Arial,sans-serif}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 12px}
.auth-card{border:0;border-radius:24px;box-shadow:0 22px 65px #29345b1c;overflow:hidden}
.brand{font-weight:800;letter-spacing:.4px;color:#5146d8}
.brand-icon{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:17px;background:#efedff;color:#5146d8;font-size:27px}
.auth-title{font-weight:750;color:#202344}
.form-control{min-height:46px;border-radius:11px;border-color:#dfe3f0}
.form-control:focus{border-color:#7167ef;box-shadow:0 0 0 .2rem #7167ef20}
.btn-primary{min-height:46px;border:0;border-radius:11px;background:linear-gradient(90deg,#5146d8,#8175ef);font-weight:650}
.auth-link{color:#5146d8;font-weight:600;text-decoration:none}.auth-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container auth-wrap"><div style="width:100%;max-width:480px">
<div class="text-center mb-4"><div class="brand-icon mb-2">▤</div><div class="brand fs-4">LibraPro</div><div class="text-secondary small">Library Management System</div></div>
<div class="card auth-card"><div class="card-body p-4 p-md-5">
{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}
{% block content %}{% endblock %}
</div></div><p class="text-center text-secondary small mt-4">Secure access · LibraPro</p>
</div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
