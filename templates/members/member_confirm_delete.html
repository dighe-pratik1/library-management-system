{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3>Delete Member</h3>
        </div>

        <div class="card-body">

            <p>
                Are you sure you want to delete
                <strong>
                    {{ member.first_name }} {{ member.last_name }}
                </strong>?
            </p>

            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger">
                    Yes, Delete
                </button>

                <a
                    href="{% url 'member_list' %}"
                    class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
