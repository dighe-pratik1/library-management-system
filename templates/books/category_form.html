{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">
            <h3>
                {% if category %}
                    Edit Category
                {% else %}
                    Add Category
                {% endif %}
            </h3>
        </div>


        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Category Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ category.name|default:'' }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                    >{{ category.description|default:'' }}</textarea>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select name="status" class="form-control">

                        <option value="ACTIVE"
                            {% if category.status or not category %}
                                selected
                            {% endif %}>
                            Active
                        </option>

                        <option value="INACTIVE"
                            {% if category and not category.status %}
                                selected
                            {% endif %}>
                            Inactive
                        </option>

                    </select>

                </div>


                <button type="submit"
                        class="btn btn-primary">

                    {% if category %}
                        Update Category
                    {% else %}
                        Add Category
                    {% endif %}

                </button>


                <a href="{% url 'category_list' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
