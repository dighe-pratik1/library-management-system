<!DOCTYPE html>
<html>

<head>

    <title>Delete Author | LibraPro</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .box {
            width: 500px;
            max-width: 90%;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel {
            margin-left: 10px;
            text-decoration: none;
            background: #eee;
            color: #333;
            padding: 10px 20px;
            border-radius: 5px;
        }

    </style>

</head>


<body>


<div class="box">


    <h2>
        Delete Author
    </h2>


    <p>

        Are you sure you want to delete

        <strong>
            {{ author.name }}
        </strong>

        ?

    </p>


    <form method="POST">

        {% csrf_token %}

        <button
            type="submit"
            class="delete">

            Yes, Delete

        </button>


        <a
            href="{% url 'author_list' %}"
            class="cancel">

            Cancel

        </a>

    </form>


</div>


</body>

</html>
