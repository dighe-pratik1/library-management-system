{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">
            <h3>
                {% if publisher %}
                    Edit Publisher
                {% else %}
                    Add Publisher
                {% endif %}
            </h3>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="row">

                    <!-- NAME -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Publisher Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ publisher.name|default:'' }}"
                               required>
                    </div>


                    <!-- PHONE -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               name="phone"
                               class="form-control"
                               value="{{ publisher.phone|default:'' }}">
                    </div>


                    <!-- EMAIL -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ publisher.email|default:'' }}">
                    </div>


                    <!-- WEBSITE -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Website
                        </label>

                        <input type="url"
                               name="website"
                               class="form-control"
                               value="{{ publisher.website|default:'' }}">
                    </div>


                    <!-- CITY -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            City
                        </label>

                        <input type="text"
                               name="city"
                               class="form-control"
                               value="{{ publisher.city|default:'' }}">
                    </div>


                    <!-- STATE -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            State
                        </label>

                        <input type="text"
                               name="state"
                               class="form-control"
                               value="{{ publisher.state|default:'' }}">
                    </div>


                    <!-- COUNTRY -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Country
                        </label>

                        <input type="text"
                               name="country"
                               class="form-control"
                               value="{{ publisher.country|default:'' }}">
                    </div>


                    <!-- PINCODE -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Pincode
                        </label>

                        <input type="text"
                               name="pincode"
                               class="form-control"
                               value="{{ publisher.pincode|default:'' }}">
                    </div>


                    <!-- ADDRESS -->
                    <div class="col-md-8 mb-3">
                        <label class="form-label">
                            Address
                        </label>

                        <textarea name="address"
                                  class="form-control"
                                  rows="2">{{ publisher.address|default:'' }}</textarea>
                    </div>


                    <!-- DESCRIPTION -->
                    <div class="col-md-12 mb-3">
                        <label class="form-label">
                            Description
                        </label>

                        <textarea name="description"
                                  class="form-control"
                                  rows="4">{{ publisher.description|default:'' }}</textarea>
                    </div>


                    <!-- LOGO -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Publisher Logo
                        </label>

                        <input type="file"
                               name="logo"
                               class="form-control">
                    </div>


                    <!-- STATUS -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select name="status"
                                class="form-control">

                            <option value="ACTIVE"
                                {% if publisher.status or not publisher %}
                                    selected
                                {% endif %}>
                                Active
                            </option>

                            <option value="INACTIVE"
                                {% if publisher and not publisher.status %}
                                    selected
                                {% endif %}>
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>


                <!-- BUTTONS -->

                <button type="submit"
                        class="btn btn-primary">

                    {% if publisher %}
                        Update Publisher
                    {% else %}
                        Add Publisher
                    {% endif %}

                </button>


                <a href="{% url 'publisher_list' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
